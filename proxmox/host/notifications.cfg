sendmail: mail-to-root
	comment Send mails to root@pam's email address
	mailto-user root@pam

matcher: default-matcher
	comment Route all notifications to mail-to-root
	disable true
	mode all
	target mail-to-root

smtp: gmail
	author Proxmox server-proxmox
	comment Alerts to Gmail. Password = Gmail app password, set in the UI
	from-address paul.jar4millo@gmail.com
	mailto paul.jar4millo@gmail.com
	mode tls
	port 465
	server smtp.gmail.com
	username paul.jar4millo@gmail.com

matcher: alertas-gmail
	comment Warnings, errors and mail from homelab scripts/cron (system-mail) to Gmail
	match-severity warning,error,unknown
	mode all
	target gmail
