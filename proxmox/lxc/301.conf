#Offsite backup gateway%3A rclone serve restic (append-only, TLS) to Google Drive. See docs/backup.md
arch: amd64
cores: 1
features: nesting=1
hostname: ops-backup
memory: 512
nameserver: 192.168.1.3
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.1.1,hwaddr=BC:24:11:E0:02:61,ip=192.168.1.31/24,type=veth
onboot: 1
ostype: debian
rootfs: local:301/vm-301-disk-0.raw,size=4G
searchdomain: local
startup: order=1
swap: 512
timezone: America/Mexico_City
unprivileged: 1
