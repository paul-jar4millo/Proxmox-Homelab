arch: amd64
cores: 1
cpuunits: 512
features: nesting=1,keyctl=1
hostname: net-adguard
memory: 1024
net0: name=eth0,bridge=vmbr0,gw=192.168.1.1,hwaddr=BC:24:11:84:8A:C3,ip=192.168.1.3/24,type=veth
onboot: 1
ostype: debian
rootfs: local:110/vm-110-disk-0.raw,size=6G
swap: 1024
tags:  
timezone: America/Mexico_City
unprivileged: 1
