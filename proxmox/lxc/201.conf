arch: amd64
cores: 2
dev0: /dev/dri/renderD128
features: nesting=1,keyctl=1
hostname: app-frigate
memory: 2048
mp0: local:201/vm-201-disk-1.raw,mp=/mnt/frigate/media,size=64G
net0: name=eth0,bridge=vmbr0,gw=192.168.1.1,hwaddr=BC:24:11:ED:C2:18,ip=192.168.1.201/24,type=veth
onboot: 1
ostype: debian
rootfs: local:201/vm-201-disk-0.raw,size=32G
swap: 512
tags:  
timezone: America/Mexico_City
unprivileged: 1
