# Paths left out of the offsite backup: <vmid|*> <vzdump --exclude-path glob>
# Anchored at the container's root. Everything here must be re-creatable
# without the backup; the restore runbook in docs/backup.md says how.
#
# Mount points with backup=0 (Frigate recordings, mp0 of 201) are skipped by
# vzdump already and are not listed here.

*    /var/cache/apt/archives/?*
*    /var/tmp/?*

# Frigate: Docker images and layers are pulled again with `docker compose pull`.
# Frigate's config and database live in /opt/frigate/config, which is kept.
# This Docker uses the containerd image store, so the images (~15 GB) are in
# /var/lib/containerd; /var/lib/docker holds only small state. Exclude both.
201  /var/lib/containerd/?*
201  /var/lib/docker/?*
